name: Build APK

on:
  push:
    branches: [ soghatyar-build ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove placeholder wrapper jar
        run: rm -f gradle/wrapper/gradle-wrapper.jar

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-log.txt

      - name: Publish results to branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build-log.txt /tmp/out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/ 2>/dev/null || true
          cp gradle/wrapper/gradle-wrapper.jar /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan results_tmp
          git rm -rf . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/out/* . 2>/dev/null || true
          git add -A
          git commit -m "build results $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push -f origin HEAD:soghatyar-results

      - name: Reflect build status
        if: steps.build.outcome != 'success'
        run: exit 1
